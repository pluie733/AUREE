<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f2f2f5">
<title>AURE</title>
<style>
:root{--glass:rgba(255,255,255,.62);--ink:#1c1c1e;--sub:#8a8a90;--red:#ff3b30;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
font-family:-apple-system,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:var(--ink);background:#f2f2f5}
#bg{position:fixed;inset:0;background:
radial-gradient(55% 38% at 15% 8%,#ffe1ea,transparent 70%),
radial-gradient(50% 38% at 95% 28%,#d9e8ff,transparent 70%),
radial-gradient(60% 45% at 25% 95%,#e0f5e6,transparent 70%),
radial-gradient(40% 30% at 90% 85%,#efe3ff,transparent 70%),#f2f2f5}
/* status bar */
#sbar{position:fixed;left:0;right:0;top:var(--st);height:48px;padding:6px 30px 0 34px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:16px;font-weight:600}
.standalone #sbar{display:none}
#sbar .r{display:flex;gap:6px;align-items:center}
/* pages */
#pages{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:center;padding:calc(var(--st) + 56px) 18px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:80px;row-gap:12px;align-content:start}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(1.6);backdrop-filter:blur(24px) saturate(1.6);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 8px 24px rgba(0,0,0,.06)}
/* widgets */
.w{border-radius:26px;position:relative;overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.w:active{transform:scale(.97)}
#wide{grid-column:1/-1;grid-row:span 2;height:158px;align-self:start;padding:16px 18px}
#wide .d{font-size:12.5px;font-weight:600;color:var(--red)}
#wide .g{font-size:27px;font-weight:700;letter-spacing:-.5px;margin-top:2px}
#wide .q{margin-top:8px;font-size:14px;color:#3a3a3c;transition:opacity .5s;min-height:20px}
#wide .from{font-size:11.5px;color:var(--sub);margin-top:3px}
#wide .chip{position:absolute;right:16px;top:14px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#7c5cff,#38b6ff);border-radius:10px;padding:3px 8px}
#wide .bar{position:absolute;left:18px;right:18px;bottom:14px;height:3px;border-radius:2px;background:rgba(0,0,0,.07);overflow:hidden}
#wide .bar i{display:block;height:100%;width:0;background:rgba(0,0,0,.25);border-radius:2px}
#ai{grid-column:span 2;grid-row:span 2;height:172px;align-self:start;margin-right:8px}
#ai .orb{position:absolute;left:50%;top:30px;width:70px;height:70px;margin-left:-35px;border-radius:50%;background:conic-gradient(from 0deg,#7c5cff,#38b6ff,#5ee7c0,#ff9ad5,#7c5cff);filter:blur(7px);animation:spin 8s linear infinite,breathe 4s ease-in-out infinite}
#ai .core{position:absolute;left:50%;top:38px;width:54px;height:54px;margin-left:-27px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,rgba(255,255,255,.35) 60%,rgba(255,255,255,.1));box-shadow:0 0 0 1px rgba(255,255,255,.6) inset;animation:breathe 4s ease-in-out infinite}
#ai .t{position:absolute;left:16px;bottom:34px;font-size:16px;font-weight:700}
#ai .s{position:absolute;left:16px;bottom:15px;font-size:12px;color:var(--sub)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{scale:.92}50%{scale:1.08}}
/* icons */
.app{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
.ic{width:58px;height:58px;border-radius:14px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 10px rgba(0,0,0,.12);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.app:active .ic{transform:scale(.88)}
.ic::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 50%);pointer-events:none}
.ic svg{width:100%;height:100%}
.app span{font-size:11.5px;font-weight:500;color:var(--ink)}
.ch{font-size:26px;font-weight:700;color:#fff;font-family:-apple-system,"PingFang SC",sans-serif}
.cal{background:#fff;flex-direction:column;gap:0}
.cal b{font-size:10px;color:var(--red);font-weight:700;line-height:1;margin-top:2px}
.cal i{font-style:normal;font-size:28px;font-weight:300;line-height:1.1}
.soon{grid-column:1/-1;grid-row:span 2;height:150px;border:1.5px dashed rgba(0,0,0,.16);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--sub);font-size:14px}
.soon b{font-size:30px;font-weight:200;color:#b0b0b6}
/* dots + dock */
#dots{position:fixed;left:0;right:0;bottom:calc(var(--sb) + 124px);display:flex;justify-content:center;gap:9px;z-index:3}
#dots i{width:7px;height:7px;border-radius:50%;background:rgba(0,0,0,.2);transition:.3s}
#dots i.on{background:rgba(0,0,0,.75);transform:scale(1.15)}
#dock{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 12px);height:92px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;padding:0 8px;z-index:4;background:rgba(255,255,255,.45)}
#dock .app span{display:none}
#dock .app{transform:translateY(20px)}
.orbic{background:radial-gradient(circle at 30% 25%,#fff,#c9b8ff 40%,#6aa8ff 75%,#5ee7c0)}
/* banner */
#bn{position:fixed;left:50%;top:calc(var(--st) + 8px);width:min(92%,380px);transform:translate(-50%,-160%);z-index:30;border-radius:24px;padding:12px 14px;display:flex;gap:10px;align-items:center;transition:transform .5s cubic-bezier(.2,1.1,.3,1);pointer-events:none;background:rgba(255,255,255,.8)}
#bn.s{transform:translate(-50%,0)}
#bn .ic{width:36px;height:36px;border-radius:9px;flex:none}
#bn .a{font-size:13px;font-weight:600}#bn .b{font-size:13px;color:#555;margin-top:1px}
/* edit mode */
.edit .app .ic{animation:jig .28s ease-in-out infinite alternate}
.edit .app:nth-child(even) .ic{animation-delay:-.14s}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
#done{position:fixed;right:20px;top:calc(var(--st) + 14px);z-index:6;font-size:15px;font-weight:600;padding:6px 14px;border-radius:16px;display:none}
.edit #done{display:block}
@media (min-width:500px){body{display:flex;justify-content:center}#bg,#pages,#sbar,#dock,#dots{left:50%;right:auto;width:420px;transform:translateX(-50%)}#pages{inset:0 auto 0 50%}#dock{left:50%;margin-left:0}}
.app{position:relative}
.ic{border-radius:13px}
.badge{position:absolute;top:-7px;left:calc(50% + 12px);min-width:21px;height:21px;padding:0 6px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;z-index:2}
.app span{white-space:nowrap}
#bn .ic{width:36px;height:36px;border-radius:9px}
#bg{inset:-80px 0 -200px 0}
.standalone .page{padding-top:calc(var(--st) + 12px)}
#bn{transform:translate(-50%,-300%);opacity:0;visibility:hidden;transition:transform .5s cubic-bezier(.2,1.1,.3,1),opacity .3s,visibility 0s .5s}
#bn.s{transform:translate(-50%,0);opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,1.1,.3,1),opacity .3s,visibility 0s}

<script>
(function(){
  var $=function(i){return document.getElementById(i)},de=document.documentElement;
  if(navigator.standalone||matchMedia('(display-mode: standalone)').matches)de.classList.add('standalone');
  var wk=['日','一','二','三','四','五','六'];
  // 时间 / 问候 / 日期
  function tick(){
    var d=new Date(),h=d.getHours(),m=('0'+d.getMinutes()).slice(-2);
    $('clock').textContent=('0'+h).slice(-2)+':'+m;
    $('hi').textContent=h<5?'夜深了':h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';
    $('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wk[d.getDay()];
    if($('wk'))$('wk').textContent='周'+wk[d.getDay()];if($('dn'))$('dn').textContent=d.getDate();
  }
  tick();setInterval(tick,15000);
  // 每日一句轮播
  var qs=[['快乐的秘诀是停止胡思乱想！','来自村民 SHErLOckMxX 的评论'],['慢一点，也是在向前。','每日一句'],['今天也要好好吃饭。','每日一句'],['先喝口水，再慢慢想。','每日一句']],qi=0,q=$('q'),f=$('from'),pg=$('prog');
  function show(){
    q.style.opacity=0;
    setTimeout(function(){q.textContent=qs[qi][0];f.textContent=qs[qi][1];q.style.opacity=1;
      pg.style.transition='none';pg.style.width='0';
      requestAnimationFrame(function(){requestAnimationFrame(function(){pg.style.transition='width 6s linear';pg.style.width='100%'})});
      qi=(qi+1)%qs.length},350);
  }
  q.textContent=qs[0][0];f.textContent=qs[0][1];qi=1;requestAnimationFrame(function(){requestAnimationFrame(function(){pg.style.transition='width 6s linear';pg.style.width='100%'})});setInterval(show,6400);
  // 页面圆点
  var pages=$('pages'),dots=document.querySelectorAll('#dots i');
  pages.addEventListener('scroll',function(){
    var i=Math.round(pages.scrollLeft/pages.clientWidth);
    dots.forEach(function(d,k){d.classList.toggle('on',k===i)});
  },{passive:true});
  dots.forEach(function(d,k){d.addEventListener('click',function(){pages.scrollTo({left:k*pages.clientWidth,behavior:'smooth'})})});
  // 横幅提示
  var bn=$('bn'),tm,editing=false;
  function banner(name,el){
    $('bt').textContent=name;
    var ic=el&&el.querySelector('.ic');$('bic').innerHTML=ic?ic.outerHTML:'<div class="ic orbic"></div>';
    bn.classList.add('s');clearTimeout(tm);
    tm=setTimeout(function(){bn.classList.remove('s')},1800);
    if(navigator.vibrate)navigator.vibrate(8);
  }
  // 点击 / 长按编辑
  var lp;
  document.querySelectorAll('[data-n]').forEach(function(el){
    el.addEventListener('click',function(){if(editing||el.hasAttribute('data-go'))return;banner(el.getAttribute('data-n'),el)});
    el.addEventListener('touchstart',function(){clearTimeout(lp);lp=setTimeout(function(){editing=true;de.classList.add('edit')},550)},{passive:true});
    ['touchend','touchmove','touchcancel'].forEach(function(e){el.addEventListener(e,function(){clearTimeout(lp)},{passive:true})});
  });
  function exit(){editing=false;de.classList.remove('edit')}
  $('done').addEventListener('click',exit);
  $('bg').addEventListener('click',exit);
  pages.addEventListener('click',function(e){if(editing&&e.target.classList.contains('page'))exit()});
})();
</script>

<div id="replica" aria-live="polite"></div>

(function(){

 {id:101,name:'喵喵酱',ava:'cat',time:'12分钟前',tag:'喵星人',text:'今天它又把我的耳机线当成猎物了，认真地叼着走了半个客厅。',photo:'cat',likes:47,comments:6},
 {id:102,name:'小白兔',ava:'rabbit',time:'1小时前',tag:'小宠',text:'第一次带兔兔出门晒太阳，全程趴在草地上不肯走。',photo:'rabbit',likes:31,comments:4},
 {id:103,name:'云朵',ava:'swan',time:'3小时前',tag:'日常',text:'小区池塘来了一只天鹅，傍晚特别安静，大家都放轻了脚步。',photo:'swan',likes:82,comments:9}

const IC={
 home:'<svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
 msg:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
 star:'<svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z"/></svg>',
 me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
 heart:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
 cmt:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>'
};
function nav(cur){
 const n=(k,ic,go)=>`<div class="n ${cur===k?'on':''}" onclick="pcGo('${go}')">${ic}</div>`;
 return `<div class="bottomnav">${n('community',IC.home,'community')}${n('messages',IC.msg,'messages')}<div class="n center" onclick="pcPush('compose')">${IC.plus}</div>${n('saved',IC.star,'saved')}${n('profile',IC.me,'profile')}</div>`;
}
function frame(title,body,o){o=o||{};
 return `<section class="screen ${o.nav?'hasnav':''}">${o.decor===false?'':'<div class="paw"></div>'}<div class="head"><span class="back" onclick="replicaBack()">‹</span>${title}<span class="more">⋮</span></div>${body}</section>${o.nav?nav(o.nav):''}`;
}

 const ph=p.photo?(p.photo.indexOf('data:')===0?`<div class="pphoto real" style="background-image:url(${p.photo})"></div>`:`<div class="pphoto pic-${p.photo}" style="background-image:var(--i-${p.photo})"></div>`):'';
 return `<div class="post"><div class="ph"><div class="av sm" style="${avStyle(p.mine?ME.ava:p.ava)}"></div><div><div class="nm">${esc(p.mine?ME.name:p.name)}</div><div class="tm">${p.time}</div></div><span class="tag">${esc(p.tag)}</span></div><div class="ptxt">${esc(p.text)}</div>${ph}<div class="pfoot"><span class="${p.liked?'on':''}" onclick="pcLike(${p.id})">${IC.heart}${p.likes+(p.liked?1:0)}</span><span onclick="replicaToast('评论功能即将开放')">${IC.cmt}${p.comments}</span><span class="fv ${p.fav?'on':''}" onclick="pcFav(${p.id})">${IC.star}</span>${p.mine?`<span class="del" onclick="pcDel(${p.id})">删除</span>`:''}</div></div>`;
}
function emptyHTML(t){return `<div class="empty"><div class="av" style="background-image:var(--i-heart)"></div>${t}</div>`}
function openReplica(which){screenStack=[];render(which);root.classList.add('open');try{history.pushState({aure:1},'')}catch(e){}}
window.addEventListener('popstate',function(){if(!root.classList.contains('open'))return;if(screenStack.length){render(screenStack.pop());try{history.pushState({aure:1},'')}catch(e){}}else root.classList.remove('open')});
(function(){let sx=0,sy=0,ok=false;
 root.addEventListener('touchstart',function(e){const t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=sx<26},{passive:true});
 root.addEventListener('touchend',function(e){if(!ok)return;const t=e.changedTouches[0];if(t.clientX-sx>70&&Math.abs(t.clientY-sy)<70)replicaBack();ok=false},{passive:true});
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&root.classList.contains('open'))replicaBack()});
})();
function render(which){
 root.dataset.current=which;let h='';
 const b={
  community(){

  },

   const body=tab==='post'?(mine.length?mine.map(p=>postHTML(p)).join(''):emptyHTML('你还没有发过帖子<br>点下面的 + 试试')):`<div class="hint" style="padding:26px 10px;text-align:left;color:#777;font-weight:500">喜欢软乎乎的小动物，也喜欢在傍晚拍下它们安静的样子。<br>欢迎来 AURE 宠物社区，一起分享毛孩子的日常。</div>`;
   return frame('个人主页',`<div class="av xl" style="margin-top:6px;${avStyle(ME.ava)}"></div><div class="profile-name">${ME.name}</div><div class="stats"><div>我的关注<b>38</b></div><div>关注我的<b>126</b></div><div>获赞<b>${mine.reduce((s,p)=>s+p.likes+(p.liked?1:0),0)+58}</b></div></div><div class="actions"><div class="action" onclick="replicaToast('已关注')">＋ 关注</div><div class="action" onclick="replicaPush('messages')">✉ 私信</div></div><div class="tabs"><span class="${tab==='post'?'active':''}" onclick="pcTab('post')">发帖 ${mine.length}</span><span class="${tab==='about'?'active':''}" onclick="pcTab('about')">关于</span></div>${body}`,{nav:'profile'});

  },
  edit(){return frame('编辑',`<div class="avatarplus" onclick="replicaPush('avatar')"><div class="av xl" style="${avStyle(ME.ava)}"></div><div class="plus">＋</div></div><div class="profile-name">${ME.name}</div><div class="fieldlabel">名称</div><input class="field" style="width:100%;border:0;outline:0;color:#30283c;font-size:14px" maxlength="16" value="${esc(ME.name)}" oninput="pcName(this.value)"><div class="fieldlabel">邮箱</div><input class="field" style="width:100%;border:0;outline:0;color:#30283c;font-size:14px" type="email" inputmode="email" maxlength="40" value="${esc(ME.email)}" oninput="pcEmail(this.value)"><div class="fieldlabel">电话</div><input class="field" style="width:100%;border:0;outline:0;color:#30283c;font-size:14px" type="tel" inputmode="tel" maxlength="20" value="${esc(phoneNum)}" oninput="pcPhone(this.value)"><div class="fieldlabel">国家</div><div class="field" style="justify-content:space-between;color:#30283c;cursor:pointer" onclick="replicaPush('country')">${esc(ME.country)} <span>⌄</span></div><button class="primary" style="margin-top:28px" onclick="replicaToast('资料已保存')"><span>保存</span></button>`)},
  login(){return frame('登录',`<div class="auth-title">欢迎来到<br>AURE 宠物世界</div><div class="socialbtns"><button class="socialbtn" onclick="replicaToast('QQ登录')">QQ登录</button><button class="socialbtn dark" onclick="replicaToast('微信登录')">微信登录</button></div><div class="under">或者选择邮箱登录</div><div class="lineinput"><span class="tinyicon">✉</span><input placeholder="hello@aure.app" type="email"></div><div class="lineinput"><span class="tinyicon">♙</span><input placeholder="••••••••••" type="password"><span class="tinyicon">◉</span></div><div class="forgot" onclick="replicaPush('phone')">忘记密码？</div><button class="primary" onclick="replicaToast('登录信息已提交')"><span>登录</span></button><div class="under" style="margin-top:24px" onclick="replicaPush('phone')">没有账户？注册</div>`)},

  },
  thread(){
   const c=convList().find(x=>x.id===curConv)||{name:'',msgs:[],time:''};
   return `<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="avg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aebddf"/><stop offset="1" stop-color="#7885c4"/></linearGradient><clipPath id="avc"><circle cx="22.5" cy="22.5" r="22.5"/></clipPath></defs></svg><div class="thhead"><span class="bk" onclick="replicaBack()">‹</span>${AVSVG}<small>${esc(c.name)} ›</small></div><section class="screen thbody" id="thBody"><div class="thtime">${c.id==='v'?'今天 '+(c.msgs[0]?c.msgs[0].t:''):esc(c.time)}</div>${c.msgs.map(m=>`<div class="bub ${m.from==='me'?'me':''}">${esc(m.text)}</div>`).join('')}</section><div class="thbar"><span class="pl">+</span><input id="thIn" placeholder="信息 · 短信" onkeydown="if(event.key==='Enter')pcThreadSend()"><button onclick="pcThreadSend()">↑</button></div>`;
  },
  avatar(){return frame('更换头像',`<div class="av xl" style="${avStyle(ME.ava)}"></div><div class="fieldlabel" style="margin-top:22px">选择一个头像</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">${PRESETS.map(k=>`<div class="av" style="width:100%;height:auto;aspect-ratio:1;background-image:var(--i-${k});${ME.ava===k?'border:2px solid #555':''}" onclick="pcAva('${k}')"></div>`).join('')}</div><label class="primary" style="margin-top:28px"><span>从相册选择</span><input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0" onchange="pcAvaPhoto(this)"></label>`)},
  country(){return frame('选择国家',COUNTRIES.map(c=>`<div class="settingrow" onclick="pcCountry('${c}')">${c}${c===ME.country?'<span class="chev" style="color:#555">✓</span>':''}</div>`).join(''))},
  messages(){return frame('我的消息',emptyHTML('还没有消息'),{nav:'messages'})},
  settings(){return frame('设置',`<div class="settingsgroup">账户</div>${[['▣','个人信息','edit'],['⬡','安全','login'],['♙','隐私','settings'],['♧','通知','settings'],['✉','支持中心','settings']].map(x=>`<div class="settingrow" onclick="replicaPush('${x[2]}')"><span class="settingicon">${x[0]}</span>${x[1]}<span class="chev">›</span></div>`).join('')}<div class="settingsgroup">发布</div><div class="settingrow" onclick="replicaPush('saved')"><span class="settingicon">▣</span>收藏<span class="chev">›</span></div><div class="settingrow" onclick="replicaPush('profile')"><span class="settingicon">♥</span>我的发帖<span class="chev">›</span></div><div class="settingsgroup">其他</div><div class="settingrow"><span class="settingicon">文</span>语言<span class="chev">›</span></div><div class="settingrow"><span class="settingicon">⚑</span>条款与条件<span class="chev">›</span></div>`)},
  call(){return `<section class="screen" style="padding:0"><div class="callbg"><div class="calltile" style="background-image:var(--i-cat)"></div><div class="calltime">3 : 47</div><div class="callcontrols"><button onclick="replicaToast('摄像头已切换')">▣</button><button style="background:#e5534b" onclick="replicaBack()">☎</button><button onclick="replicaToast('扬声器已切换')">◖))</button></div></div></section>`}
 };
 root.innerHTML=(b[which]||b.settings)();

window.openReplica=openReplica;
window.replicaBack=function(){if(screenStack.length)render(screenStack.pop());else root.classList.remove('open')};

window.pcPush=window.replicaPush;

window.replicaToast=function(t){const n=document.createElement('div');n.textContent=t;n.style.cssText='position:absolute;z-index:99;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(60,60,60,.88);color:#fff;padding:10px 18px;border-radius:14px;font-size:14px;white-space:nowrap';root.appendChild(n);setTimeout(()=>n.remove(),1400)};
function keepScroll(fn){const s=root.querySelector('.screen'),y=s?s.scrollTop:0;fn();const s2=root.querySelector('.screen');if(s2)s2.scrollTop=y}

function saveSms(){try{localStorage.setItem('aure_sms_v1',JSON.stringify(sms))}catch(e){}}
function dockBadge(){
 const app=document.querySelector('#dock [data-go="messages"]');if(!app)return;
 const old=app.querySelector('.badge');if(old)old.remove();
 const n=sms.filter(m=>!m.read).length;
 if(n){const b=document.createElement('div');b.className='badge';b.textContent=n;app.insertBefore(b,app.firstChild)}
}
function smsBanner(text){
 const d=document.createElement('div');
 d.style.cssText='position:absolute;z-index:98;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 8px);background:rgba(250,250,252,.96);box-shadow:0 6px 24px rgba(0,0,0,.16);border-radius:16px;padding:11px 13px;display:flex;gap:10px;align-items:center;cursor:pointer';
 d.innerHTML='<div class="av sm" style="background-image:var(--i-heart)"></div><div style="min-width:0"><div style="font-size:13px;font-weight:700">AURE 信息</div><div style="font-size:12.5px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(text)+'</div></div>';
 d.onclick=function(){d.remove();replicaPush('sms')};
 root.appendChild(d);setTimeout(()=>d.remove(),4500);
}
function sendCode(){
 pendingCode=String(Math.floor(100000+Math.random()*900000));
 const dt=new Date(),t=('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
 const text='【AURE】您的验证码是 '+pendingCode+'，5分钟内有效，请勿告诉他人。';
 sms.push({id:Date.now(),text:text,time:t,read:false,code:pendingCode});saveSms();dockBadge();
 return text;
}
window.pcSend=function(){
 const el=document.getElementById('repPhone');if(el){phoneNum=el.value;saveMe()}
 if(phoneNum.replace(/\D/g,'').length<11){replicaToast('请输入正确的手机号');return}
 const text=sendCode();replicaPush('verify');smsBanner(text);
};
window.pcResend=function(){const text=sendCode();smsBanner(text)};
window.pcFill=function(){
 if(root.dataset.current!=='verify'){return}
 const last=sms[sms.length-1];if(!last)return;
 root.querySelectorAll('.codeboxes input').forEach((i,k)=>i.value=last.code[k]||'');
};
window.pcSmsTap=function(){const i=screenStack.lastIndexOf('verify');if(i<0){replicaToast('验证码已显示在短信中');return}screenStack=screenStack.slice(0,i);render('verify');pcFill();replicaToast('已自动填入验证码')};
window.pcVerify=function(){
 const v=Array.from(root.querySelectorAll('.codeboxes input')).map(i=>i.value).join('');
 if(v.length<6){replicaToast('请输入6位验证码');return}
 if(v===pendingCode){pendingCode=null;replicaToast('验证成功');setTimeout(()=>{screenStack=[];render('login')},900)}
 else replicaToast('验证码不正确');
};
window.pcEmail=function(v){ME.email=v.trim();saveMe()};
window.pcPhone=function(v){phoneNum=v;saveMe()};
window.pcName=function(v){ME.name=v.trim()||'栗子小雀';saveMe()};
window.pcAva=function(k){ME.ava=k;saveMe();replicaBack();replicaToast('头像已更换')};
window.pcCountry=function(c){ME.country=c;saveMe();replicaBack();replicaToast('国家已更改')};
window.pcAvaPhoto=function(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=function(){const im=new Image();im.onload=function(){
  const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=256;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,256,256);
  x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,256,256);
  ME.ava=c.toDataURL('image/jpeg',.8);saveMe();replicaBack();replicaToast('头像已更换');
 };im.src=r.result};
 r.readAsDataURL(f);
};

let curConv=null;const replies={};
const AVSVG='<svg class="pa" viewBox="0 0 45 45"><circle cx="22.5" cy="22.5" r="22.5" fill="url(#avg)"/><g clip-path="url(#avc)"><circle cx="22.5" cy="17" r="7.6" fill="#fff"/><ellipse cx="22.5" cy="39" rx="14" ry="9" fill="#fff" stroke="#8a96cc" stroke-width="1.2"/></g></svg>';
const SEEDS=[
 {id:'s1',name:'10690881245',time:'昨天',prev:'【AURE Pay】您的账户于11月25日收到一笔转入 ¥28.00，请注意查收。'},
 {id:'s2',name:'+86 139 5016 2284',time:'2026/11/20',prev:'周末一起带毛孩子去公园玩吧？我把零食也带上。'},
 {id:'s3',name:'10690700218',time:'2026/11/02',prev:'【AURE】欢迎加入 AURE 宠物社区，回复 TD 退订。'},
 {id:'s4',name:'+86 186 2037 4455',time:'2026/10/18',prev:'好的，那我们明天下午三点见。'}
];
function convList(){
 const arr=[],now=new Date(),hm=('0'+now.getHours()).slice(-2)+':'+('0'+now.getMinutes()).slice(-2);
 if(sms.length){const l=sms[sms.length-1];arr.push({id:'v',name:'10690348117',time:l.time,prev:l.text,unread:sms.filter(m=>!m.read).length,msgs:sms.map(m=>({text:m.text,t:m.time,from:'them'}))})}
 SEEDS.forEach(x=>arr.push({id:x.id,name:x.name,time:x.time,prev:x.prev,unread:0,msgs:[{text:x.prev,from:'them'}]}));
 arr.forEach(c=>{const r=replies[c.id]||[];if(r.length){c.msgs=c.msgs.concat(r.map(t=>({text:t,from:'me'})));c.prev=r[r.length-1];c.time=hm}});
 return arr;
}
function smsRows(q){
 q=(q||'').trim().toLowerCase();
 const list=convList().filter(c=>!q||c.name.toLowerCase().indexOf(q)>=0||c.prev.toLowerCase().indexOf(q)>=0);
 return list.length?list.map(c=>`<div class="sr" onclick="pcOpenConv('${c.id}')">${c.unread?'<i class="ud"></i>':''}${AVSVG}<div class="sm"><div class="st"><b>${esc(c.name)}</b><span>${esc(c.time)}<svg viewBox="0 0 8 14"><path d="M1.5 1.5L7 7l-5.500 5.500"/></svg></span></div><p>${esc(c.prev)}</p></div></div>`).join(''):`<div class="empty">无结果</div>`;
}
window.pcSmsSearch=function(v){const el=document.getElementById('smsList');if(el)el.innerHTML=smsRows(v)};
window.pcOpenConv=function(id){
 if(id==='v'){sms.forEach(m=>m.read=true);saveSms();dockBadge();
  const i=screenStack.lastIndexOf('verify');
  if(i>=0){screenStack=screenStack.slice(0,i);render('verify');pcFill();replicaToast('已自动填入验证码');return}}
 curConv=id;replicaPush('thread');
 const b=document.getElementById('thBody');if(b)b.scrollTop=b.scrollHeight;
};
window.pcThreadSend=function(){
 const inp=document.getElementById('thIn'),t=inp&&inp.value.trim();if(!t)return;
 (replies[curConv]=replies[curConv]||[]).push(t);
 const b=document.getElementById('thBody'),d=document.createElement('div');d.className='bub me';d.textContent=t;b.appendChild(d);b.scrollTop=b.scrollHeight;inp.value='';
};
const byId=id=>posts.find(p=>p.id===id);
window.pcLike=function(id){const p=byId(id);if(!p)return;p.liked=!p.liked;save();keepScroll(()=>render(root.dataset.current))};
window.pcFav=function(id){const p=byId(id);if(!p)return;p.fav=!p.fav;save();keepScroll(()=>render(root.dataset.current));replicaToast(p.fav?'已收藏':'已取消收藏')};
window.pcDel=function(id){posts=posts.filter(p=>p.id!==id);save();keepScroll(()=>render(root.dataset.current));replicaToast('已删除')};
window.pcFilter=function(t){filter=t;render('community')};
window.pcTab=function(t){tab=t;render('profile')};
window.pcTag=function(el,t){draft.tag=t;el.parentNode.querySelectorAll('.chip2').forEach(c=>c.classList.toggle('on',c===el))};
function phWrap(){
 const w=document.getElementById('pcPhWrap');if(!w)return;
 w.innerHTML=draft.photo?`<div class="addph" style="background-image:url(${draft.photo})"><i onclick="pcRmPhoto()">×</i></div>`:`<label class="addph"><b>+</b>添加照片<input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0" onchange="pcPhoto(this)"></label>`;
}
window.pcRmPhoto=function(){draft.photo=null;phWrap()};
window.pcPhoto=function(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=function(){const im=new Image();im.onload=function(){
  const m=720,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  draft.photo=c.toDataURL('image/jpeg',.72);phWrap();
 };im.src=r.result};
 r.readAsDataURL(f);
};
window.pcPublish=function(){
 const t=(document.getElementById('pcText').value||'').trim();
 if(!t&&!draft.photo){replicaToast('写点什么或加张照片吧');return}
 posts.unshift({id:Date.now(),name:ME.name,ava:ME.ava,time:'刚刚',tag:draft.tag,text:t||'（分享了一张照片）',photo:draft.photo,likes:0,comments:0,mine:true});
 save();filter='全部';screenStack=[];render('community');replicaToast('发布成功');
};
document.querySelectorAll('[data-go]').forEach(function(el){
 el.addEventListener('click',function(e){if(document.documentElement.classList.contains('edit'))return;e.stopImmediatePropagation();openReplica(el.getAttribute('data-go'))},true);
});
})();
</script>

<div id="appsheet"><div class="box"><h4>编辑应用</h4><div class="row"><div class="pv ic" id="asPv"></div><input class="nm" id="asName" maxlength="12" placeholder="应用名称"></div><div class="lab">选择图标</div><div class="pre" id="asPre"></div><div class="btns"><label>从相册选择<input type="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0" id="asFile"></label><button id="asReset">恢复默认</button><button class="ok" id="asOk">完成</button></div></div></div>
<script>
(function(){
const de=document.documentElement,KEY='aure_apps_v1',$=id=>document.getElementById(id);
let cfg={};try{cfg=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cfg))}catch(e){}}
const PRE=['cat','rabbit','swan','butterfly','heart'];
const apps=[].slice.call(document.querySelectorAll('.app[data-n]')),orig={};
apps.forEach(a=>{const ic=a.querySelector('.ic');a.dataset.id=a.dataset.n;orig[a.dataset.id]={ic:ic.innerHTML,cls:ic.className,st:ic.getAttribute('style'),name:a.dataset.n}});
function imgStyle(img){return img.indexOf('data:')===0?'background-image:url('+img+');background-size:cover':'background-image:var(--i-'+img+')'}
function paint(ic,id,c){const o=orig[id];
 if(c.img){ic.className='ic pic';ic.innerHTML='';ic.setAttribute('style',imgStyle(c.img))}
 else{ic.className=o.cls;ic.innerHTML=o.ic;if(o.st)ic.setAttribute('style',o.st);else ic.removeAttribute('style')}}
function apply(a){const id=a.dataset.id,c=cfg[id]||{},name=c.name||orig[id].name;
 a.querySelector('span').textContent=name;a.dataset.n=name;paint(a.querySelector('.ic'),id,c)}
apps.forEach(apply);
let cur=null,tmp={};
function pv(){paint($('asPv'),cur.dataset.id,tmp);
 [].forEach.call($('asPre').children,i=>i.classList.toggle('on',i.dataset.k===tmp.img))}
$('asPre').innerHTML=PRE.map(k=>'<i data-k="'+k+'" style="background-image:var(--i-'+k+')"></i>').join('');
$('asPre').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k){tmp.img=k;pv()}});
$('asName').addEventListener('input',e=>{tmp.name=e.target.value});
$('asReset').addEventListener('click',()=>{tmp={};$('asName').value=orig[cur.dataset.id].name;pv()});
$('asFile').addEventListener('change',function(){
 const f=this.files&&this.files[0];if(!f)return;const r=new FileReader();
 r.onload=function(){const im=new Image();im.onload=function(){
  const m=Math.min(im.width,im.height),c=document.createElement('canvas');c.width=c.height=192;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,192,192);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,192,192);
  tmp.img=c.toDataURL('image/jpeg',.8);pv()};im.src=r.result};
 r.readAsDataURL(f);this.value='';
});
$('asOk').addEventListener('click',()=>{
 const id=cur.dataset.id,n=(tmp.name||'').trim();
 if((!n||n===orig[id].name)&&!tmp.img)delete cfg[id];else cfg[id]={name:n||undefined,img:tmp.img};
 save();apply(cur);$('appsheet').classList.remove('open')});
$('appsheet').addEventListener('click',e=>{if(e.target===$('appsheet'))$('appsheet').classList.remove('open')});
function openSheet(a){cur=a;const c=cfg[a.dataset.id]||{};tmp={name:c.name,img:c.img};
 $('asName').value=c.name||orig[a.dataset.id].name;pv();$('appsheet').classList.add('open')}
let editAt=0;
new MutationObserver(()=>{if(de.classList.contains('edit'))editAt=Date.now()}).observe(de,{attributes:true,attributeFilter:['class']});
apps.forEach(a=>{
 a.addEventListener('click',e=>{if(!de.classList.contains('edit'))return;e.stopImmediatePropagation();e.preventDefault();if(Date.now()-editAt<700)return;openSheet(a)},true);
 a.addEventListener('contextmenu',e=>{e.preventDefault();de.classList.add('edit')});
});
})();
</script>



<div id="wsheet"><div class="wback"></div><div class="wpanel">
 <div class="wgrab"></div>
 <div class="wtitle" id="wtitle">编辑组件</div>
 <div id="wfields"></div>
 <div class="wrow"><label class="wbtn" id="wpick">更换照片<input type="file" id="wfile" accept="image/*" hidden></label><button class="wbtn ghost" id="wrm">移除照片</button></div>
 <div id="wsz"><label>组件大小<input type="range" id="ws" min="0.5" max="1.8" step="0.02"><output id="wsv">100%</output></label></div>
 <div id="wadj"><label>缩放<input type="range" id="wz" min="1" max="3" step="0.02"></label><label>左右<input type="range" id="wx" min="-50" max="50" step="1"></label><label>上下<input type="range" id="wy" min="-50" max="50" step="1"></label></div>
 <div class="wrow"><button class="wbtn ghost" id="wreset">恢复默认</button><button class="wbtn main" id="wdone">完成</button></div>
</div></div>
<script>
(function(){
 var KEY='aure_widgets_v3',LKEY='aure_layout_v1';
 var BW={w1:340,w2:300,w3:240},HT={w1:124,w2:300*482/860,w3:240*.75};
 var DEFPG={w1:2,w2:0,w3:0};
 var DEF={
  w1:{n:'100',photo:'',z:1,x:0,y:0,fx:null,py:null,pg:null,s:1},
  w2:{cap:'',photo:'',z:1,x:0,y:0,fx:null,py:null,pg:null,s:.72},
  w3:{t:'be kind\nto yourself',photo:'',z:1,x:0,y:0,fx:null,py:null,pg:null,s:.72}
 };
 var CFG={
  w1:{title:'点赞条',fields:[{k:'n',label:'数字 / 文字',max:8,multi:false}],photoLabel:'更换中间圆形照片'},
  w2:{title:'照片屏幕',fields:[{k:'cap',label:'照片说明（可留空）',max:24,multi:false}],photoLabel:'更换屏幕照片'},
  w3:{title:'便签卡片',fields:[{k:'t',label:'便签文字（可换行）',max:48,multi:true}],photoLabel:'更换右上角贴纸照片'}
 };
 var CONTENT=['n','cap','t','photo','z','x','y'];
 var st=null,raw=null;
 try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 if(!raw){ // 从旧版本只迁移文字和照片
  try{var o=JSON.parse(localStorage.getItem('aure_widgets_v2')||localStorage.getItem('aure_widgets_v1')||'null');
   if(o){raw={};Object.keys(o).forEach(function(k){raw[k]={};CONTENT.forEach(function(c){if(o[k]&&o[k][c]!==undefined)raw[k][c]=o[k][c]})})}}catch(e){}
 }
 st=raw||{};
 Object.keys(DEF).forEach(function(k){st[k]=Object.assign({},DEF[k],st[k]||{})});
 function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
 function $(i){return document.getElementById(i)}
 var html=document.documentElement,pagesEl=$('pages');
 function PG(){return [].slice.call(pagesEl.children).filter(function(n){return n.classList&&n.classList.contains('page')})}
 var EL={};['w1','w2','w3'].forEach(function(k){EL[k]=document.querySelector('.'+k)});

 // ---------- App 排列 ----------
 function saveLayout(){
  try{localStorage.setItem(LKEY,JSON.stringify(PG().map(function(p){
   return [].slice.call(p.children).filter(function(n){return n.classList.contains('app')&&n.getAttribute('data-n')}).map(function(n){return n.getAttribute('data-n')})
  })))}catch(e){}
 }
 (function(){
  var L=null;try{L=JSON.parse(localStorage.getItem(LKEY)||'null')}catch(e){}
  if(!L)return;
  var pages=PG(),all={};
  pagesEl.querySelectorAll('.app[data-n]').forEach(function(a){all[a.getAttribute('data-n')]=a});
  L.forEach(function(names,i){
   var pg=pages[i];if(!pg)return;var soon=pg.querySelector('.soon');
   names.forEach(function(n){var a=all[n];if(a){pg.insertBefore(a,soon||null);delete all[n]}});
  });
 })();

 // ---------- 小组件内容 ----------
 function paintPhoto(root,d){
  var el=root.querySelector('.ph'),i=el.querySelector('i');
  if(d.photo){el.classList.add('on');i.style.backgroundImage='url('+d.photo+')';
   i.style.transform='translate('+d.x+'%,'+d.y+'%) scale('+d.z+')'}
  else{el.classList.remove('on');i.style.backgroundImage=''}
 }
 function render(){
  var r1=EL.w1,d1=st.w1;
  r1.querySelector('[data-f=n]').textContent=d1.n;
  paintPhoto(r1,d1);r1.querySelector('.chat').classList.toggle('has',!!d1.photo);
  var r2=EL.w2,d2=st.w2,cap=r2.querySelector('.cap');
  cap.textContent=d2.cap;cap.classList.toggle('on',!!d2.cap);
  paintPhoto(r2,d2);r2.querySelector('.scr').classList.toggle('has',!!d2.photo);
  var r3=EL.w3,d3=st.w3;
  r3.querySelector('[data-f=t]').textContent=d3.t;
  paintPhoto(r3,d3);r3.classList.toggle('hasph',!!d3.photo);
 }
 // ---------- 小组件位置 ----------
 function topOf(pg){
  var ex=pg.classList.contains('p1')?270:pg.classList.contains('wpage')?140:0;
  return (parseFloat(getComputedStyle(pg).paddingTop)||60)-ex;
 }
 function mount(id){
  var pages=PG(),d=st[id],i=d.pg!=null?d.pg:DEFPG[id];
  var t=pages[i]||pages[0];if(EL[id].parentNode!==t)t.appendChild(EL[id]);
 }
 function defPos(id,w,W){
  var pg=EL[id].parentNode;
  if(id==='w1')return {x:(W-w)/2,y:topOf(pg)};
  var t0=topOf(PG()[0]);
  if(id==='w2')return {x:18,y:t0};
  return {x:Math.max(14,W-18-w),y:t0+HT.w2*st.w2.s+10};
 }
 function clamp(id,x,y){
  var pg=EL[id].parentNode,W=pg.clientWidth,H=pg.clientHeight,s=st[id].s,w=BW[id]*s,h=HT[id]*s;
  return {x:Math.min(Math.max(0,x),Math.max(0,W-w)),y:Math.min(Math.max(0,y),Math.max(0,H-h-10))};
 }
 function place(id){
  var el=EL[id],d=st[id],pg=el.parentNode,W=pg.clientWidth;if(!W)return;
  var w=BW[id]*d.s,p=d.fx==null?defPos(id,w,W):{x:d.fx*W,y:d.py};
  p=clamp(id,p.x,p.y);
  el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.setProperty('--s',d.s);
 }
 function curPos(id){return {x:parseFloat(EL[id].style.left)||0,y:parseFloat(EL[id].style.top)||0}}
 function placeAll(){['w1','w2','w3'].forEach(function(id){mount(id);place(id)})}
 render();placeAll();
 window.addEventListener('resize',placeAll);window.addEventListener('orientationchange',placeAll);
 setTimeout(placeAll,60);

 // ---------- 长按编辑 + 拖动（App 与小组件，可跨页） ----------
 var lp=null,sx=0,sy=0,armed=null,D=null,ghost=null,ph=null,edgeT=null,edgeLock=false,edgeDir=0,lastX=0,lastY=0,noClick=0;
 function pageIdx(){return Math.max(0,Math.min(PG().length-1,Math.round(pagesEl.scrollLeft/pagesEl.clientWidth)))}
 function itemOf(t){
  if(!t||!t.closest)return null;
  var w=t.closest('.wg');if(w)return {el:w,type:'w',id:w.getAttribute('data-w')};
  var a=t.closest('#pages .app');if(a)return {el:a,type:'a'};
  return null;
 }
 function begin(it,x,y,pid){
  var r=it.el.getBoundingClientRect();
  D={it:it,sx:x,sy:y,ox:x-r.left,oy:y-r.top,go:false,w:r.width,h:r.height};
  try{html.setPointerCapture(pid)}catch(_){}
 }
 document.addEventListener('pointerdown',function(e){
  if(e.target.closest&&e.target.closest('#wsheet'))return;
  var it=itemOf(e.target);if(!it)return;
  if(!html.classList.contains('edit')){
   sx=e.clientX;sy=e.clientY;armed=null;clearTimeout(lp);
   lp=setTimeout(function(){lp=null;html.classList.add('edit');armed={it:it,pid:e.pointerId};noClick=Date.now()+99999;if(navigator.vibrate)navigator.vibrate(10)},520);
   return;
  }
  begin(it,e.clientX,e.clientY,e.pointerId);
 },true);
 function startDrag(){
  D.go=true;var el=D.it.el,r=el.getBoundingClientRect();
  pagesEl.style.scrollSnapType='none';
  ghost=el.cloneNode(true);ghost.removeAttribute('data-w');ghost.removeAttribute('data-go');
  ghost.className=el.className+' ghostel';
  ghost.style.cssText='position:fixed;left:'+r.left+'px;top:'+r.top+'px;margin:0;z-index:60;pointer-events:none;transition:none;';
  if(D.it.type==='w'){ghost.style.width=BW[D.it.id]+'px';ghost.style.setProperty('--s',st[D.it.id].s);ghost.style.transformOrigin='0 0';ghost.style.transform='scale('+st[D.it.id].s+')';ghost.style.outline='none';el.style.visibility='hidden'}
  else{ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';
   ph=document.createElement('div');ph.className='app aph';ph.innerHTML='<div class="ic aphic"></div>';
   el.parentNode.insertBefore(ph,el);el.style.display='none';}
  document.body.appendChild(ghost);
 }
 function reorder(pg,cx,cy){
  var tol=44,before=null,kids=[].slice.call(pg.children);
  for(var i=0;i<kids.length;i++){
   var a=kids[i];if(!a.classList.contains('app')||a===ph||a===D.it.el)continue;
   var r=a.getBoundingClientRect(),mx=r.left+r.width/2,my=r.top+r.height/2;
   if(my-cy>tol||(Math.abs(my-cy)<=tol&&mx>cx)){before=a;break}
  }
  var ref=before||pg.querySelector('.soon')||null;
  if(ph.parentNode!==pg||(ref?ph.nextSibling!==ref:ph.nextSibling!==null))pg.insertBefore(ph,ref);
 }
 function edge(cx){
  var r=pagesEl.getBoundingClientRect(),lx=cx-r.left,dir=lx<36?-1:(lx>r.width-36?1:0);
  if(!dir){clearTimeout(edgeT);edgeT=null;edgeDir=0;edgeLock=false;return}
  if(edgeLock||(edgeDir===dir&&edgeT))return;
  clearTimeout(edgeT);edgeDir=dir;
  edgeT=setTimeout(function(){
   edgeT=null;var ni=pageIdx()+dir;if(ni<0||ni>=PG().length)return;
   pagesEl.scrollTo({left:ni*pagesEl.clientWidth,behavior:'smooth'});
   edgeLock=true;
   setTimeout(function(){edgeLock=false;if(D&&D.go)edge(lastX)},850);
  },420);
 }
 function update(){
  if(!D||!D.go)return;
  ghost.style.left=(lastX-D.ox)+'px';ghost.style.top=(lastY-D.oy)+'px';
  if(D.it.type==='a')reorder(PG()[pageIdx()],lastX,lastY);
  edge(lastX);
 }
 document.addEventListener('pointermove',function(e){
  if(lp&&(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)){clearTimeout(lp);lp=null}
  if(armed&&!D&&Math.hypot(e.clientX-sx,e.clientY-sy)>4){var a=armed;armed=null;begin(a.it,sx,sy,a.pid)}
  if(!D)return;
  if(!D.go){if(Math.hypot(e.clientX-D.sx,e.clientY-D.sy)<4)return;startDrag()}
  lastX=e.clientX;lastY=e.clientY;update();
 });
 pagesEl.addEventListener('scroll',function(){if(D&&D.go)update()},{passive:true});
 document.addEventListener('touchmove',function(e){if(D||armed)e.preventDefault()},{passive:false});
 function endDrag(){
  clearTimeout(lp);lp=null;armed=null;clearTimeout(edgeT);edgeT=null;edgeLock=false;edgeDir=0;
  if(!D)return;var d=D;D=null;
  if(!d.go)return;
  var el=d.it.el,pi=0;
  if(d.it.type==='a'){
   var pgA=ph.parentNode;pgA.insertBefore(el,ph);ph.remove();ph=null;el.style.display='';
   pi=PG().indexOf(pgA);saveLayout();
  }else{
   var id=d.it.id;pi=pageIdx();var pg=PG()[pi];
   if(el.parentNode!==pg)pg.appendChild(el);
   var pr=pg.getBoundingClientRect();
   var p=clamp(id,lastX-d.ox-pr.left,lastY-d.oy-pr.top);
   el.style.left=p.x+'px';el.style.top=p.y+'px';el.style.visibility='';
   st[id].pg=pi;st[id].fx=p.x/pg.clientWidth;st[id].py=p.y;save();
  }
  if(ghost){ghost.remove();ghost=null}
  noClick=Date.now()+350;
  pagesEl.style.scrollSnapType='';
  pagesEl.scrollTo({left:pi*pagesEl.clientWidth,behavior:'smooth'});
 }
 document.addEventListener('pointerup',function(){if(!D&&!armed)noClick=Math.min(noClick,Date.now()+350);endDrag()});
 document.addEventListener('pointercancel',endDrag);
 document.addEventListener('click',function(e){
  if(Date.now()<noClick){e.stopPropagation();e.preventDefault()}
 },true);
 document.addEventListener('contextmenu',function(e){if(itemOf(e.target))e.preventDefault()});

 // ---------- 编辑面板 ----------
 var cur=null,sheet=$('wsheet');
 document.querySelectorAll('.wg').forEach(function(el){
  el.addEventListener('click',function(){
   if(html.classList.contains('edit'))return;
   openSheet(el.getAttribute('data-w'));
  });
 });
 function sync(){
  var d=st[cur],has=!!d.photo;
  $('wrm').classList.toggle('on',has);$('wadj').classList.toggle('on',has);
  $('wz').value=d.z;$('wx').value=d.x;$('wy').value=d.y;$('ws').value=d.s;$('wsv').textContent=Math.round(d.s*100)+'%';
 }
 function lift(on){
  if(!cur)return;var el=EL[cur];
  el.style.setProperty('--lift','0px');if(!on)return;
  var pr=document.querySelector('.wpanel').getBoundingClientRect(),r=el.getBoundingClientRect();
  var dy=Math.min(0,pr.top-14-r.bottom);dy=Math.max(dy,70-r.top);
  el.style.setProperty('--lift',dy+'px');
 }
 function openSheet(id){
  cur=id;var c=CFG[id],d=st[id];
  $('wtitle').textContent='编辑 · '+c.title;
  var box=$('wfields');box.innerHTML='';
  c.fields.forEach(function(f){
   var lab=document.createElement('label');lab.className='wf';lab.appendChild(document.createTextNode(f.label));
   var inp=document.createElement(f.multi?'textarea':'input');
   if(f.multi)inp.rows=3;inp.maxLength=f.max;inp.value=d[f.k];
   inp.addEventListener('input',function(){d[f.k]=inp.value;render();save()});
   lab.appendChild(inp);box.appendChild(lab);
  });
  $('wpick').firstChild.nodeValue=c.photoLabel;
  sync();sheet.classList.add('open');
  setTimeout(function(){lift(true)},30);
 }
 function closeSheet(){lift(false);sheet.classList.remove('open');cur=null}
 sheet.querySelector('.wback').addEventListener('click',closeSheet);
 $('wdone').addEventListener('click',closeSheet);
 $('wfile').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f||!cur)return;
  var id=cur,fr=new FileReader();
  fr.onload=function(){
   var im=new Image();
   im.onload=function(){
    var M=720,sc=Math.min(1,M/Math.max(im.width,im.height)),cv=document.createElement('canvas');
    cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
    var d=st[id];d.photo=cv.toDataURL('image/jpeg',.86);d.z=1;d.x=0;d.y=0;
    render();save();if(cur===id)sync();
   };
   im.src=fr.result;
  };
  fr.readAsDataURL(f);e.target.value='';
 });
 $('wrm').addEventListener('click',function(){if(!cur)return;var d=st[cur];d.photo='';d.z=1;d.x=0;d.y=0;render();save();sync()});
 [['wz','z'],['wx','x'],['wy','y']].forEach(function(p){
  $(p[0]).addEventListener('input',function(){if(!cur)return;st[cur][p[1]]=parseFloat(this.value);render();save()});
 });
 $('ws').addEventListener('input',function(){
  if(!cur)return;var id=cur;st[id].s=parseFloat(this.value);$('wsv').textContent=Math.round(st[id].s*100)+'%';
  var p=curPos(id);st[id].fx=p.x/EL[id].parentNode.clientWidth;st[id].py=p.y;
  place(id);save();lift(true);
 });
 $('wreset').addEventListener('click',function(){
  if(!cur)return;var id=cur;st[id]=Object.assign({},DEF[id]);render();mount(id);place(id);save();
  EL[id].style.setProperty('--lift','0px');openSheet(id);
 });
})();
</script>

favs:function(){var ts=S.fav.map(find).filter(Boolean),as=S.favA.map(alb).filter(Boolean);
 return '<div class="mh">收藏</div>'+(as.length?'<h3>专辑</h3>'+hs(as):'')+(ts.length?'<h3>歌曲</h3>'+ts.map(function(t){return row(t)}).join(''):'')+(ts.length||as.length?'':'<div class="empty"><b>还没有收藏</b>在专辑页点「收藏」，或在歌曲菜单里收藏歌曲</div>')},
me:function(){return '<div class="mh">我的</div><div class="me"><div class="av">'+esc((S.user||'A')[0].toUpperCase())+'</div><b>'+esc(S.user)+'</b><p>已选 '+S.art.length+' 位喜欢的歌手 · 收藏 '+(S.fav.length+S.favA.length)+' 项</p><button class="pri" data-a="addloc" style="margin-bottom:12px;background:#f1f1f3;color:#555!important">添加本地音乐</button><button class="pri" data-a="reartists" style="margin-bottom:12px;background:#f1f1f3;color:#555!important">重新选择歌手</button><button class="pri" data-a="logout">退出登录</button></div>'},
recent:function(){var ts=S.rec.map(find).filter(Boolean);return head('最近播放')+(ts.length?ts.map(function(t){return row(t)}).join(''):'<div class="empty">'+cv(0)+'<b>您最近没有听过歌曲哦</b>这里找到历史上听过的歌曲</div>')},
search:function(a){return head('')+'<label class="sb" style="margin-top:-38px;margin-left:30px">'+I.search+'<input id="mq" placeholder="艺术家、歌曲、专辑" value="'+esc(a||'')+'"></label><div id="sr"></div>'},
album:function(id){var al=alb(id),ts=T(al),f=S.favA.indexOf(id)>-1;
 return head('',id)+'<div class="ab">'+cv(al.h)+'<h2>'+esc(al.t)+'</h2><p>'+esc(al.a)+'</p><p style="font-size:11px">'+(al.p?'歌单':al.y)+'</p></div><div class="pr"><button data-a="play:'+ts[0].k+'">'+I.play+'播放</button><button data-a="shuffle:'+id+'">'+I.shuf+'随机</button></div>'
 +'<div class="ac"><div class="'+(f?'on':'')+'" data-a="favA:'+id+'">'+I.heart+'收藏</div><div data-a="toast:'+esc(al.t)+' · 共 '+ts.length+' 首">'+I.info+'信息</div><div data-a="toast:已加入下载队列（演示）">'+I.dl+'下载</div><div data-a="share:'+id+'">'+I.share+'分享</div></div><div class="tl">'+ts.map(function(t,i){return row(t,i)}).join('')+'</div>'}
};
var nt;
function netSearch(q){
 clearTimeout(nt);var o=$('sn');if(!o)return;if(q.length<2){o.innerHTML='';return}
 o.innerHTML='<div class="hint">在线搜索中…</div>';
 nt=setTimeout(function(){fetch('https://itunes.apple.com/search?media=music&entity=song&limit=15&country=CN&term='+encodeURIComponent(q)).then(function(r){return r.json()}).then(function(j){
  var o2=$('sn');if(!o2||!$('mq')||$('mq').value.trim().toLowerCase()!==q)return;
  NETQ=(j.results||[]).filter(function(x){return x.previewUrl}).map(function(x){var k='net'+x.trackId;return NET[k]||(NET[k]={k:k,n:x.trackName,i:0,net:1,src:x.previewUrl,al:{id:'net',t:x.collectionName||'在线结果',a:x.artistName,h:H(x.artistName)%360}})});
  o2.innerHTML=NETQ.length?'<h3>在线结果（30 秒试听）</h3>'+NETQ.map(function(t){return row(t)}).join(''):'<div class="hint">在线没有找到相关歌曲</div>';
 }).catch(function(){var o2=$('sn');if(o2)o2.innerHTML='<div class="hint">在线搜索暂不可用：需要联网，且当前页面所在站点要允许访问外部网络</div>'})},500);
}
function drawSR(){
 var q=($('mq').value||'').trim().toLowerCase(),o=$('sr');
 if(!q){clearTimeout(nt);o.innerHTML='<div class="hint">搜索艺术家、歌曲或专辑</div><button class="pri" data-a="addloc" style="background:#f1f1f3;color:#555!important">添加本地音乐</button>';return}
 var as=AL.filter(function(a){return (a.t+a.a).toLowerCase().indexOf(q)>-1}),ts=[];AL.forEach(function(a){T(a).forEach(function(t){if((t.n+a.a).toLowerCase().indexOf(q)>-1)ts.push(t)})});
 o.innerHTML=(as.length?'<h3>专辑</h3>'+hs(as.slice(0,12)):'')+(ts.length?'<h3>歌曲</h3>'+ts.slice(0,20).map(function(t){return row(t)}).join(''):'')+(as.length||ts.length?'':'<div class="hint" style="padding:12px 0">本地曲库没有找到相关内容</div>')+'<div id="sn"></div>';
 netSearch(q);
}
/* ---- router ---- */
var stk=[],TABS=['home','discover','favs','me'];
function draw(keep){
 var c=stk[stk.length-1],y=MS.scrollTop,tabbed=TABS.indexOf(c.n)>-1;
 MS.innerHTML=SC[c.n](c.a);MS.className=tabbed?'tabs':'';R.dataset.t=tabbed?1:0;MS.scrollTop=keep?y:0;
 TAB.innerHTML=[['home','home','首页'],['discover','disc','发现'],['favs','heart','收藏'],['me','me','我的']].map(function(t){return '<div class="'+(c.n===t[0]?'on':'')+'" data-a="tab:'+t[0]+'">'+I[t[1]]+t[2]+'</div>'}).join('');
 if(c.n==='search')drawSR();
}
function go(n,a){stk.push({n:n,a:a});draw()}
function back(){if(stk.length>1){stk.pop();draw()}else close()}
function root(n){stk=[{n:n}];draw()}
function open(){stk=[];R.classList.add('open');root(S.user?(S.art.length>=3?'home':'pick'):'login');paint();try{history.pushState({m:1},'')}catch(e){}}
function close(){R.classList.remove('open');closeSh()}
window.addEventListener('popstate',function(){if(!R.classList.contains('open'))return;if(MSH.classList.contains('open')){closeSh()}else if(stk.length>1)stk.pop(),draw();else{close();return}try{history.pushState({m:1},'')}catch(e){}});
document.addEventListener('click',function(e){var a=e.target.closest&&e.target.closest('.app[data-n="AURE Music"]');if(!a||document.documentElement.classList.contains('edit'))return;e.stopPropagation();e.preventDefault();open()},true);
/* ---- sheet ---- */
function closeSh(){MSH.className=''}
function sheet(key){
 var al=key.indexOf('al-')===0,o=al?alb(key.slice(3)):find(key).al,t=al?null:find(key),f=t&&S.fav.indexOf(key)>-1;
 MSH.innerHTML='<div class="bd" data-a="shx"></div><div class="pn"><div class="hd">'+cv(o.h)+'<div><b>'+esc(al?o.t:t.n)+'</b><small>'+esc(o.a)+'</small><small>'+(al?(o.d||'发行于'+o.y+'年'):esc(o.t))+'</small></div></div>'
 +'<div class="r" data-a="qadd:'+key+'">添加到播放列表<i>›</i></div><div class="r" data-a="qnext:'+key+'">播放下一首<i>›</i></div>'+(al?'':'<div class="r" data-a="fav:'+key+'">'+(f?'取消收藏':'收藏歌曲')+'<i>›</i></div>')+'<div class="r" data-a="recent">最近播放<i>›</i></div></div>';
 MSH.className='open';
}
function keys(key){return key.indexOf('al-')===0?T(alb(key.slice(3))):[find(key)]}
/* ---- actions ---- */
R.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;e.stopPropagation();
 var p=el.dataset.a.split(':'),c=p[0],x=p.slice(1).join(':');
 switch(c){
 case'back':back();break;case'close':close();break;case'go':go(p[1],x.slice(p[1].length+1));break;
 case'tab':root(x);break;case'tog':tog();break;case'next':step(1);break;case'prev':step(-1);break;
 case'toast':toast(x);break;case'shx':closeSh();break;
 case'play':{var t0=find(x);if(!t0)break;if(t0.net){P.q=NETQ.slice();start(NETQ.indexOf(t0))}else{P.q=T(t0.al).slice();start(t0.i)}break}
 case'addloc':$('lf').click();break;
 case'shuffle':P.q=T(alb(x)).slice().sort(function(){return Math.random()-.5});start(0);break;
 case'sheet':e.stopPropagation();sheet(x);break;
 case'qadd':case'qnext':{var ks=keys(x);if(!P.q.length){P.q=ks.slice();start(0)}else if(c==='qadd')P.q=P.q.concat(ks);else P.q.splice.apply(P.q,[P.i+1,0].concat(ks));closeSh();toast(c==='qadd'?'已添加到播放列表':'已设为下一首播放');draw(1);break}
 case'fav':{var i=S.fav.indexOf(x);i>-1?S.fav.splice(i,1):S.fav.push(x);save();closeSh();toast(i>-1?'已取消收藏':'已添加到收藏');draw(1);break}
 case'favA':{var j=S.favA.indexOf(x);j>-1?S.favA.splice(j,1):S.favA.push(x);save();toast(j>-1?'已取消收藏':'已添加到收藏');draw(1);break}
 case'recent':closeSh();go('recent');break;
 case'share':{var al=alb(x);if(navigator.share)navigator.share({title:al.t,text:al.a+' - '+al.t}).catch(function(){});else toast('已复制分享信息（演示）');break}
 case'eye':{var pw=$('pw');pw.type=pw.type==='password'?'text':'password';break}
 case'login':{var u=$('em').value.trim(),w=$('pw').value;if(!u||!w){toast('请输入账号和密码',1);break}if(!has(u)){toast('账号不存在，请先注册',1);break}if(ACC[u]!==w){toast('密码不对，可点「忘记密码」重置',1);break}S.user=u;S.last=$('rmb').checked?u:'';save();root(S.art.length>=3?'home':'pick');break}
 case'reg':{var u2=$('ra').value.trim(),w1=$('rp').value,w2=$('rp2').value;if(u2.length<2){toast('账号至少2位',1);break}if(has(u2)){toast('该账号已注册，请直接登录',1);break}if(w1.length<4){toast('密码至少4位',1);break}if(w1!==w2){toast('两次输入的密码不一致',1);break}ACC[u2]=w1;saveAcc();S.user=u2;S.last=u2;S.art=[];save();root('pick');break}
 case'reset':{var u3=$('fa').value.trim(),n1=$('fp').value,n2=$('fp2').value;if(!has(u3)){toast('账号不存在，请先注册',1);break}if(n1.length<4){toast('新密码至少4位',1);break}if(n1!==n2){toast('两次输入的密码不一致',1);break}ACC[u3]=n1;saveAcc();S.last=u3;save();root('login');toast('密码已重置，请登录',1);break}
 case'art':{var n=x,k=S.art.indexOf(n);k>-1?S.art.splice(k,1):S.art.push(n);el.firstChild.classList.toggle('on');save();var b=$('nx');b.classList.toggle('off',S.art.length<3);b.textContent=S.art.length<3?'下一步（还需 '+(3-S.art.length)+' 位）':'下一步';break}
 case'done':root('home');break;
 case'reartists':root('pick');break;
 case'logout':S.user='';save();root('login');break;
 }
});
R.addEventListener('input',function(e){
 if(e.target.id==='mq')drawSR();
 if(e.target.id==='as'){var v=e.target.value.toLowerCase();R.querySelectorAll('.ag .art').forEach(function(a){a.style.display=a.textContent.toLowerCase().indexOf(v)>-1?'':'none'})}
});
$('lf').addEventListener('change',function(e){var fs=[].slice.call(e.target.files||[]);if(!fs.length)return;if(AL.indexOf(LOC)<0)AL.push(LOC);fs.forEach(function(f){var n=LOC.tr.length;LOC.tr.push({k:'loc-'+n,n:f.name.replace(/\.[^.]+$/,''),al:LOC,i:n,src:URL.createObjectURL(f)})});e.target.value='';toast('已添加 '+fs.length+' 首本地音乐',1);go('album','loc')});
// 滑动返回
(function(){var sx=0,sy=0,ok=false;R.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;ok=sx<26},{passive:true});R.addEventListener('touchend',function(e){if(!ok)return;var t=e.changedTouches[0];if(t.clientX-sx>70&&Math.abs(t.clientY-sy)<70)back();ok=false},{passive:true})})();
})();
</script>
